<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" fill="none">
  <rect width="900" height="700" fill="#F8F7F2"/>
  <circle cx="680" cy="560" r="170" fill="#E5A84B" fill-opacity="0.1"/>
  <circle cx="200" cy="160" r="140" fill="#234E3E" fill-opacity="0.05"/>
  <!-- hand giving book -->
  <g transform="translate(180,240)">
    <!-- left book stack -->
    <rect x="0" y="160" width="170" height="36" rx="8" fill="#234E3E"/>
    <rect x="10" y="124" width="170" height="36" rx="8" fill="#3B7157"/>
    <rect x="20" y="88" width="170" height="36" rx="8" fill="#E5A84B"/>
    <rect x="30" y="52" width="170" height="36" rx="8" fill="#8FB59A"/>
    <!-- book being passed -->
    <g transform="translate(220,20) rotate(8)">
      <rect x="0" y="0" width="190" height="130" rx="12" fill="#F3D49B"/>
      <rect x="0" y="0" width="190" height="130" rx="12" stroke="#234E3E" stroke-opacity="0.1"/>
      <path d="M95 0v130" stroke="#234E3E" stroke-opacity="0.12" stroke-width="3"/>
      <path d="M20 35h55M20 55h55M20 75h40" stroke="#234E3E" stroke-opacity="0.18" stroke-width="5" stroke-linecap="round"/>
      <path d="M115 35h55M115 55h55M115 75h40" stroke="#234E3E" stroke-opacity="0.18" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- arrow -->
    <g transform="translate(430,70)">
      <circle cx="56" cy="56" r="56" fill="#234E3E"/>
      <path d="M38 56h36m-12-12l12 12-12 12" stroke="#E5A84B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- id card -->
    <g transform="translate(560,130)">
      <rect x="0" y="0" width="150" height="96" rx="14" fill="#FFFFFF" stroke="#234E3E" stroke-opacity="0.1"/>
      <circle cx="40" cy="40" r="20" fill="#8FB59A" fill-opacity="0.5"/>
      <path d="M75 30h50M75 48h40" stroke="#234E3E" stroke-opacity="0.18" stroke-width="5" stroke-linecap="round"/>
      <rect x="20" y="70" width="110" height="8" rx="4" fill="#E5A84B" fill-opacity="0.45"/>
    </g>
  </g>
</svg>